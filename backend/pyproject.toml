[project]
name = "ocp-module-statistics"
version = "0.3.0"
description = "Statistics query and municipal import module for Open City Planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = ["pydantic>=2.11.7", "sqlalchemy>=2.0.42"]

[project.entry-points."open_city_planner.modules"]
statistics = "ocp_module_statistics.module:DEFINITION"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pyyaml==6.0.3",
  "ruff>=0.12.8",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocp_module_statistics*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
required-version = "==0.12.5"
build-constraint-dependencies = ["setuptools==84.0.0"]
