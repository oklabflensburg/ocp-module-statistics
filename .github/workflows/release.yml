name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag input
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          source_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          checkout_commit=$(git rev-parse HEAD)
          if [[ "$checkout_commit" != "$source_commit" ]]; then
            echo "Tag resolves to $source_commit but checkout is $checkout_commit" >&2
            exit 1
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - name: Validate tag and version
        run: |
          manifest_version=$(cd backend && uv run python -c 'import yaml; print(yaml.safe_load(open("../module.yaml"))["version"])')
          if [[ "$VERSION" != "$manifest_version" ]]; then
            echo "Tag version $VERSION does not match module.yaml version $manifest_version" >&2
            exit 1
          fi
      - run: uv run ruff check src tests && uv run pytest
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - name: Clean release outputs
        run: rm -rf dist backend/dist frontend/dist
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" SOURCE_COMMIT="$SOURCE_COMMIT" scripts/build-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/host-contract-test
      - run: sha256sum -c "dist/statistics-${VERSION}.ocp.sha256"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_error="$RUNNER_TEMP/release-error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>"$release_error"; then
            echo "Release $RELEASE_TAG already exists; refusing to replace its state or assets." >&2
            exit 1
          fi
          if ! grep -q "HTTP 404" "$release_error"; then
            cat "$release_error" >&2
            echo "Could not safely establish that release $RELEASE_TAG is absent." >&2
            exit 1
          fi

          artifacts=(
            "backend/dist/ocp_module_statistics-${VERSION}-py3-none-any.whl"
            "frontend/dist/statistics-${VERSION}.tgz"
            "dist/statistics-${VERSION}.ocp"
            "dist/statistics-${VERSION}.ocp.sha256"
          )
          for artifact in "${artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Expected release artifact is missing: $artifact" >&2
              exit 1
            fi
          done

          gh release create "$RELEASE_TAG" \
            "${artifacts[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Open City Planner Statistics query and import module"
