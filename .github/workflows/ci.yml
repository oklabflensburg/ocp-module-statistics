name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-release-workflow

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) uv build --wheel --clear
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm contract:check
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  bundle-contract:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Determine module version
        run: |
          version=$(cd backend && uv run python -c 'import yaml; print(yaml.safe_load(open("../module.yaml"))["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/build-bundle
      - run: sha256sum -c "dist/statistics-${VERSION}.ocp.sha256"
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/host-contract-test
